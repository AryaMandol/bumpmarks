<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#3157d5">
    <title>Page not found - BumpMarks</title>
    <style>
        :root {
            font-family: "Segoe UI Variable", Aptos, "Segoe UI", system-ui, sans-serif;
            color: #172033;
            background: #f5f7fb;
        }
        body {
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        main {
            width: min(100%, 430px);
            padding: 30px;
            border: 1px solid #dce3ef;
            border-top: 4px solid #3157d5;
            border-radius: 20px;
            background: #fff;
        }
        h1 { margin: 0; font-size: 28px; letter-spacing: -0.04em; }
        p { margin: 10px 0 0; color: #647086; line-height: 1.55; }
        nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
        a {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            padding: 0 15px;
            border-radius: 12px;
            background: #3157d5;
            color: #fff;
            text-decoration: none;
            font-weight: 750;
        }
        a.secondary { background: #eaf0ff; color: #3157d5; }
    </style>
</head>
<body>
    <main>
        <h1>That page is not here.</h1>
        <p>Your local BumpMarks records are unaffected. Return to the landing page or open the tracker.</p>
        <nav>
            <a href="/app">Open BumpMarks</a>
            <a class="secondary" href="/">Home</a>
        </nav>
    </main>
</body>
</html>
