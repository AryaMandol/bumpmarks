<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#faf8f5">
    <title>BumpMarks - Offline</title>
    <style>
        :root {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #252422;
            background: #f7f5f2;
        }

        body {
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 420px);
            padding: 28px;
            border: 1px solid #e8e3dd;
            border-radius: 24px;
            background: #fff;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        p {
            margin: 10px 0 0;
            color: #77726d;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 14px;
            background: #554b45;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <h1>BumpMarks is offline</h1>
        <p>If the app was installed and loaded previously, return to the main screen and your locally stored movement data should remain available.</p>
        <a href="/">Try BumpMarks again</a>
    </main>
</body>
</html>
