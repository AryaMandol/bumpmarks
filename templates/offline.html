<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#3157d5">
    <title>BumpMarks - Offline</title>
    <style>
        :root {
            font-family: "Segoe UI Variable", Aptos, "Segoe UI", system-ui, sans-serif;
            color: #172033;
            background: #f5f7fb;
        }

        body {
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 420px);
            padding: 28px;
            border: 1px solid #dce3ef;
            border-top: 4px solid #3157d5;
            border-radius: 20px;
            background: #ffffff;
        }

        h1 {
            margin: 0;
            font-size: 25px;
            letter-spacing: -0.035em;
        }

        p {
            margin: 10px 0 0;
            color: #647086;
            line-height: 1.55;
        }

        a {
            display: inline-flex;
            min-height: 46px;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            padding: 0 16px;
            border-radius: 12px;
            background: #3157d5;
            color: #ffffff;
            text-decoration: none;
            font-weight: 750;
        }

        a:focus-visible {
            outline: 3px solid #173cae;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <h1>BumpMarks is offline</h1>
        <p>If BumpMarks was loaded previously, your locally stored movement data remains on this device.</p>
        <a href="/app">Open BumpMarks</a>
    </main>
</body>
</html>
