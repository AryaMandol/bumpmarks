name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build production bundle
        run: python build_static.py

      - name: Verify release
        run: python verify_release.py --skip-build

      - name: Package static release
        run: |
          mkdir release
          zip -r "release/bumpmarks-${GITHUB_REF_NAME}.zip" dist LICENSE README.md ASSETS.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release/bumpmarks-${GITHUB_REF_NAME}.zip#Static production bundle" \
            --title "BumpMarks ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES_v1.0.0.md \
            --verify-tag
